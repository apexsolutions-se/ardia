<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Ardia</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    body {
      position: relative;
    }

    /* HOMEPAGE UNDERNEATH */
    .homepage {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #0f1724;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: clamp(28px, 4vw, 56px);
      letter-spacing: 0.08em;
    }

    /* INTRO OVERLAY */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: transparent;
      pointer-events: none;
    }

    /* Centered logo layer */
    .logo-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 23;
    }

    .intro-logo {
      width: min(520px, 62vw);
      max-width: 90%;
      height: auto;
      opacity: 0;
      transform: translateY(6px);
      animation: logoFadeIn 1.8s ease forwards;
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TWO WHITE PANELS */
    .panel {
      position: absolute;
      inset: 0;
      background: #ffffff;
      will-change: transform;
      transition: transform 1.25s cubic-bezier(0.77, 0, 0.18, 1);
    }

    /*
      These two shapes create the diagonal cut.
      Adjust these 4 values if needed:
      - 54.8%
      - 57.6%
      They control where the diagonal starts/ends.
    */
.panel-left {
  z-index: 21;
  clip-path: polygon(0 0, 61% 0, 40% 100%, 0 100%);
}

.panel-right {
  z-index: 21;
  clip-path: polygon(59% 0, 100% 0, 100% 100%, 39% 100%);
}

    /* THIN SLASH LINE */
    .slash-line {
      position: absolute;
      top: 49%;
      left: 50.8%;
      width: 2px;
      height: 0;
      background: #1c2d5a;
      transform: translate(-50%, -50%) rotate(23deg);
      transform-origin: center;
      z-index: 24;
      opacity: 0;
      transition:
        height 0.45s ease,
        opacity 0.25s ease;
    }

    /* OPEN STATE */
    .intro.open .slash-line {
      height: 39px;
      opacity: 1;
    }

    /* WEBSITE OPENS FROM THE SLASH */
    .intro.split .panel-left {
      transform: translateX(-100%) skewX(-2deg);
    }

    .intro.split .panel-right {
      transform: translateX(100%) skewX(-2deg);
    }

    .intro.split .logo-wrap,
    .intro.split .slash-line {
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    /* optional subtle homepage entrance */
    .homepage-content {
      opacity: 0;
      transform: scale(1.02);
      animation: homeReveal 0.9s ease forwards;
      animation-delay: 0.28s;
    }

    @keyframes homeReveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <main class="homepage">
    <div class="homepage-content">Launching Soon</div>
  </main>

  <div class="intro" id="intro">
    <div class="panel panel-left"></div>
    <div class="panel panel-right"></div>

    <div class="logo-wrap">
      <img src="assets/studio-ardia-logo.png" alt="Studio Ardia Logo" class="intro-logo" />
    </div>

    <div class="slash-line"></div>
  </div>

  <script>
    const intro = document.getElementById('intro');

    setTimeout(() => {
      intro.classList.add('open');
    }, 1700);

    setTimeout(() => {
      intro.classList.add('split');
    }, 2250);

    setTimeout(() => {
      intro.style.display = 'none';
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';
    }, 3800);
  </script>

</body>
</html>
