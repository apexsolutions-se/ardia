<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Ardia</title>

 <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    /* logo */
    --logo-width: min(520px, 62vw);

    /* diagonal panels */
    --left-top: 61%;
    --left-bottom: 40%;
    --right-top: 59%;
    --right-bottom: 39%;

    /* slash */
    --slash-top: 49%;
    --slash-left: 50.8%;
    --slash-width: 2px;
    --slash-height: 39px;
    --slash-rotate: 23deg;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #ffffff;
  }

  body {
    position: relative;
  }

  /* HOMEPAGE UNDERNEATH */
  .homepage {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #0f1724;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: clamp(28px, 4vw, 56px);
    letter-spacing: 0.08em;
  }

  /* INTRO OVERLAY */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: transparent;
    pointer-events: none;
  }

  /* Centered logo layer */
  .logo-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    z-index: 23;
    padding-inline: 24px;
  }

  .intro-logo {
    width: var(--logo-width);
    max-width: 90%;
    height: auto;
    opacity: 0;
    transform: translateY(6px);
    animation: logoFadeIn 1.8s ease forwards;
  }

  @keyframes logoFadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* TWO WHITE PANELS */
  .panel {
    position: absolute;
    inset: 0;
    background: #ffffff;
    will-change: transform;
    transition: transform 1.25s cubic-bezier(0.77, 0, 0.18, 1);
  }

  .panel-left {
    z-index: 21;
    clip-path: polygon(0 0, var(--left-top) 0, var(--left-bottom) 100%, 0 100%);
  }

  .panel-right {
    z-index: 21;
    clip-path: polygon(var(--right-top) 0, 100% 0, 100% 100%, var(--right-bottom) 100%);
  }

  /* THIN SLASH LINE */
  .slash-line {
    position: absolute;
    top: var(--slash-top);
    left: var(--slash-left);
    width: var(--slash-width);
    height: 0;
    background: #1c2d5a;
    transform: translate(-50%, -50%) rotate(var(--slash-rotate));
    transform-origin: center;
    z-index: 24;
    opacity: 0;
    transition:
      height 0.45s ease,
      opacity 0.25s ease;
  }

  /* OPEN STATE */
  .intro.open .slash-line {
    height: var(--slash-height);
    opacity: 1;
  }

  /* WEBSITE OPENS FROM THE SLASH */
  .intro.split .panel-left {
    transform: translateX(-100%) skewX(-2deg);
  }

  .intro.split .panel-right {
    transform: translateX(100%) skewX(-2deg);
  }

  .intro.split .logo-wrap,
  .intro.split .slash-line {
    opacity: 0;
    transition: opacity 0.28s ease;
  }

  /* optional subtle homepage entrance */
  .homepage-content {
    opacity: 0;
    transform: scale(1.02);
    animation: homeReveal 0.9s ease forwards;
    animation-delay: 0.28s;
  }

  @keyframes homeReveal {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* TABLET */
  @media (max-width: 1024px) {
    :root {
      --logo-width: min(430px, 68vw);

      --left-top: 60.5%;
      --left-bottom: 40.5%;
      --right-top: 58.8%;
      --right-bottom: 39.5%;

      --slash-top: 49.2%;
      --slash-left: 50.5%;
      --slash-width: 1.8px;
      --slash-height: 34px;
      --slash-rotate: 22deg;
    }
  }

  /* MOBILE */
  @media (max-width: 768px) {
    :root {
      --logo-width: min(320px, 76vw);

      /* slightly less aggressive diagonal for smaller screens */
      --left-top: 59.5%;
      --left-bottom: 42%;
      --right-top: 58%;
      --right-bottom: 40.5%;

      /* slash tuned for mobile */
      --slash-top: 49.4%;
      --slash-left: 51%;
      --slash-width: 1.5px;
      --slash-height: 26px;
      --slash-rotate: 23deg;
    }

    .logo-wrap {
      padding-inline: 18px;
    }

    .homepage {
      font-size: clamp(22px, 6vw, 40px);
      letter-spacing: 0.06em;
      text-align: center;
      padding-inline: 20px;
    }
  }

  /* SMALL MOBILE */
  @media (max-width: 480px) {
    :root {
      --logo-width: min(280px, 80vw);

      --left-top: 58.8%;
      --left-bottom: 43%;
      --right-top: 57.2%;
      --right-bottom: 41.2%;

      --slash-top: 49.5%;
      --slash-left: 51.5%;
      --slash-width: 1.4px;
      --slash-height: 22px;
      --slash-rotate: 22deg;
    }

    .logo-wrap {
      padding-inline: 14px;
    }
  }
</style>
</head>
<body>

  <main class="homepage">
    <div class="homepage-content">Launching Soon</div>
  </main>

  <div class="intro" id="intro">
    <div class="panel panel-left"></div>
    <div class="panel panel-right"></div>

    <div class="logo-wrap">
      <img src="assets/studio-ardia-logo.png" alt="Studio Ardia Logo" class="intro-logo" />
    </div>

    <div class="slash-line"></div>
  </div>

  <script>
    const intro = document.getElementById('intro');

    setTimeout(() => {
      intro.classList.add('open');
    }, 1700);

    setTimeout(() => {
      intro.classList.add('split');
    }, 2250);

    setTimeout(() => {
      intro.style.display = 'none';
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';
    }, 3800);
  </script>

</body>
</html>
